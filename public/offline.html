<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Student Utility Hub</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #238636; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .container { max-width: 600px; padding: 2rem; }
        svg.illustration { width: 120px; height: 120px; margin-bottom: 2rem; color: #8b949e; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #fff; }
        p { font-size: 1.2rem; margin-bottom: 2rem; color: #8b949e; line-height: 1.5; }
        .button-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        button, .btn { background: var(--accent); color: #fff; border: none; padding: 1rem 2rem; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; transition: background 0.3s; }
        button:hover, .btn:hover { background: #2ea043; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-outline:hover { background: rgba(35, 134, 54, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Friendly SVG Illustration -->
        <svg class="illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        
        <h1>You are Offline</h1>
        <p>It looks like you've lost your internet connection.<br>But don't worry, many tools on the Student Utility Hub still work offline!</p>
        
        <div class="button-group">
            <button onclick="window.location.reload()">Retry Connection</button>
            <a href="/" class="btn btn-outline">Go to Homepage</a>
        </div>
    </div>
</body>
</html>
