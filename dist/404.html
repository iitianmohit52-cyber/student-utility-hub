<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Student Utility Hub</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #238636; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .container { max-width: 600px; padding: 2rem; }
        h1 { font-size: 5rem; margin-bottom: 0.5rem; color: var(--accent); }
        h2 { font-size: 2rem; margin-bottom: 1rem; color: #fff; }
        p { font-size: 1.1rem; margin-bottom: 2rem; color: #8b949e; }
        a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 1rem 2.5rem; font-size: 1.1rem; border-radius: 8px; font-weight: bold; transition: background 0.3s; }
        a:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The tool or page you are looking for does not exist or has been moved.</p>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
